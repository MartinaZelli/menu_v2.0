[pytest]
testpaths = tests

# La radice del progetto deve stare in sys.path perche' i test importano sia
# "src.*" sia "popola_db" (che vive nella radice, non in src/).
# E' l'equivalente locale del PYTHONPATH=/app usato nei due laboratori.
pythonpath = .

# -q: output compatto.
# --strict-markers: un marker scritto male diventa un errore invece di essere
#   ignorato in silenzio.
addopts = -q --strict-markers
